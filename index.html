<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interaktif SPLDV - Soal Cerita</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter / Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .var-x { color: #2563eb; font-weight: 700; } /* Blue */
        .var-y { color: #d97706; font-weight: 700; } /* Amber */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header -->
        <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i data-lucide="help-circle" class="w-6 h-6"></i>
                    <h1 class="font-extrabold text-lg sm:text-xl tracking-tight">Quiz Interaktif SPLDV</h1>
                </div>
                <div class="flex items-center gap-2">
                    <span id="score-header-badge" class="text-xs bg-indigo-500/60 px-3 py-1 rounded-full border border-indigo-300/30 font-semibold">
                        Terjawab: <span id="answered-count">0</span>/10
                    </span>
                    <button onclick="confirmReset()" title="Ulangi Quiz" class="p-1.5 bg-indigo-500/40 hover:bg-indigo-500 rounded-lg text-white transition text-xs flex items-center gap-1">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Container -->
        <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">

            <!-- Question Grid Nav -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="layout-grid" class="w-4 h-4 text-indigo-600"></i> Navigasi Soal
                    </span>
                    <span class="text-xs text-slate-400">Klik nomor untuk melompat</span>
                </div>
                <div id="nav-grid" class="grid grid-cols-5 sm:grid-cols-10 gap-2">
                    <!-- Dynamic Grid Buttons generated by JS -->
                </div>
            </div>

            <!-- Active Question Card -->
            <div id="question-card" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                <!-- Question Top Meta -->
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <span id="question-number-tag" class="bg-indigo-100 text-indigo-700 text-xs font-extrabold px-3 py-1 rounded-full">
                        Soal 1 dari 10
                    </span>
                    <span id="status-tag" class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500">
                        Belum Dijawab
                    </span>
                </div>

                <!-- Story Text -->
                <div id="question-text-box" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm sm:text-base font-medium text-slate-800 leading-relaxed">
                    <!-- Question text inserted here -->
                </div>

                <!-- Options Grid -->
                <div id="options-container" class="grid grid-cols-1 gap-3">
                    <!-- Answer options inserted here -->
                </div>

                <!-- Immediate Explanation Box (Appears after answer) -->
                <div id="explanation-box" class="hidden bg-indigo-50/70 border border-indigo-200 p-4 rounded-xl space-y-2 text-xs sm:text-sm">
                    <div class="flex items-center gap-2 text-indigo-900 font-bold">
                        <i data-lucide="book-open" class="w-4 h-4"></i> Pembahasan Langkah Substitusi:
                    </div>
                    <div id="explanation-content" class="text-slate-700 font-mono space-y-1">
                        <!-- Step by step text inserted here -->
                    </div>
                </div>

                <!-- Navigation Controls -->
                <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                    <button id="btn-prev" onclick="navigateQuestion(-1)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-semibold rounded-xl transition flex items-center gap-1.5">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Sebelumnya
                    </button>
                    <button id="btn-next" onclick="navigateQuestion(1)" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold rounded-xl transition flex items-center gap-1.5">
                        Selanjutnya <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Final Result Summary Screen (Hidden by Default) -->
            <div id="result-card" class="hidden bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200 text-center space-y-6">
                <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-3xl font-black">
                    🏆
                </div>
                <div class="space-y-2">
                    <h2 class="text-2xl font-extrabold text-slate-800">Quiz Selesai!</h2>
                    <p class="text-xs sm:text-sm text-slate-500">Berikut hasil capaian kamu pada materi SPLDV Soal Cerita:</p>
                </div>

                <!-- Stats Badges -->
                <div class="grid grid-cols-3 gap-3 max-w-md mx-auto">
                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl">
                        <div id="stat-correct" class="text-2xl font-black text-emerald-600">0</div>
                        <div class="text-xs font-semibold text-emerald-800">Benar</div>
                    </div>
                    <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl">
                        <div id="stat-wrong" class="text-2xl font-black text-rose-600">0</div>
                        <div class="text-xs font-semibold text-rose-800">Salah</div>
                    </div>
                    <div class="bg-indigo-50 border border-indigo-200 p-3 rounded-xl">
                        <div id="stat-score" class="text-2xl font-black text-indigo-600">0</div>
                        <div class="text-xs font-semibold text-indigo-800">Nilai Akhir</div>
                    </div>
                </div>

                <!-- Motivation Message -->
                <p id="stat-message" class="text-sm font-bold text-slate-700 bg-slate-50 p-3 rounded-xl max-w-md mx-auto border border-slate-200">
                    <!-- Message according to score -->
                </p>

                <!-- Action Buttons -->
                <div class="flex justify-center gap-3 pt-2">
                    <button onclick="reviewAnswers()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition flex items-center gap-1.5">
                        <i data-lucide="eye" class="w-4 h-4"></i> Tinjau Soal & Jawaban
                    </button>
                    <button onclick="confirmReset()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl text-xs sm:text-sm transition flex items-center gap-1.5">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Coba Ulangi
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white mt-8">
        Quiz Interaktif SPLDV Soal Cerita • Metode Substitusi
    </footer>

    <script>
        // Data 10 Soal Cerita SPLDV Substitusi (Sesuai kaidah kurikulum SMP)
        const quizData = [
            {
                id: 1,
                story: "Rani membeli 2 roti (<span class='var-x'>x</span>) dan 1 susu (<span class='var-y'>y</span>) seharga <strong>Rp12.000</strong>. Jika harga 1 susu adalah <strong>Rp3.000 lebih mahal</strong> dari 1 roti (<span class='var-y'>y</span> = <span class='var-x'>x</span> + 3.000), berapakah harga 1 roti?",
                options: [
                    { label: "A", text: "Rp2.500" },
                    { label: "B", text: "Rp3.000" },
                    { label: "C", text: "Rp3.500" },
                    { label: "D", text: "Rp6.000" }
                ],
                correctIndex: 1, // B
                explanation: `• Model: 2<span class="var-x">x</span> + <span class="var-y">y</span> = 12.000 dan <span class="var-y">y</span> = <span class="var-x">x</span> + 3.000<br>
                              • Substitusi <span class="var-y">y</span>: 2<span class="var-x">x</span> + (<span class="var-x">x</span> + 3.000) = 12.000<br>
                              • Hitung: 3<span class="var-x">x</span> + 3.000 = 12.000 ➔ 3<span class="var-x">x</span> = 9.000 ➔ <strong><span class="var-x">x</span> = Rp3.000</strong>`
            },
            {
                id: 2,
                story: "Harga 1 tiket dewasa (<span class='var-x'>x</span>) dan 3 tiket anak-anak (<span class='var-y'>y</span>) adalah <strong>Rp110.000</strong>. Jika harga 1 tiket dewasa adalah <strong>2 kali</strong> harga 1 tiket anak-anak (<span class='var-x'>x</span> = 2<span class='var-y'>y</span>), berapakah harga 1 tiket anak-anak?",
                options: [
                    { label: "A", text: "Rp22.000" },
                    { label: "B", text: "Rp20.000" },
                    { label: "C", text: "Rp44.000" },
                    { label: "D", text: "Rp25.000" }
                ],
                correctIndex: 0, // A
                explanation: `• Model: <span class="var-x">x</span> + 3<span class="var-y">y</span> = 110.000 dan <span class="var-x">x</span> = 2<span class="var-y">y</span><br>
                              • Substitusi <span class="var-x">x</span>: (2<span class="var-y">y</span>) + 3<span class="var-y">y</span> = 110.000<br>
                              • Hitung: 5<span class="var-y">y</span> = 110.000 ➔ <strong><span class="var-y">y</span> = Rp22.000</strong>`
            },
            {
                id: 3,
                story: "Umur Ibu (<span class='var-x'>x</span>) saat ini adalah <strong>3 kali</strong> umur Dika (<span class='var-y'>y</span>). Jika selisih umur mereka adalah <strong>28 tahun</strong> (<span class='var-x'>x</span> - <span class='var-y'>y</span> = 28), berapakah umur Dika saat ini?",
                options: [
                    { label: "A", text: "12 tahun" },
                    { label: "B", text: "16 tahun" },
                    { label: "C", text: "14 tahun" },
                    { label: "D", text: "42 tahun" }
                ],
                correctIndex: 2, // C
                explanation: `• Model: <span class="var-x">x</span> = 3<span class="var-y">y</span> dan <span class="var-x">x</span> - <span class="var-y">y</span> = 28<br>
                              • Substitusi <span class="var-x">x</span>: 3<span class="var-y">y</span> - <span class="var-y">y</span> = 28<br>
                              • Hitung: 2<span class="var-y">y</span> = 28 ➔ <strong><span class="var-y">y</span> = 14 tahun</strong>`
            },
            {
                id: 4,
                story: "Pak Budi membeli 3 buku tulis (<span class='var-x'>x</span>) dan 2 pulpen (<span class='var-y'>y</span>) seharga <strong>Rp26.000</strong>. Jika harga 1 pulpen adalah <strong>Rp2.000 lebih murah</strong> dari 1 buku tulis (<span class='var-y'>y</span> = <span class='var-x'>x</span> - 2.000), berapakah harga 1 buku tulis?",
                options: [
                    { label: "A", text: "Rp4.000" },
                    { label: "B", text: "Rp5.000" },
                    { label: "C", text: "Rp7.000" },
                    { label: "D", text: "Rp6.000" }
                ],
                correctIndex: 3, // D
                explanation: `• Model: 3<span class="var-x">x</span> + 2<span class="var-y">y</span> = 26.000 dan <span class="var-y">y</span> = <span class="var-x">x</span> - 2.000<br>
                              • Substitusi <span class="var-y">y</span>: 3<span class="var-x">x</span> + 2(<span class="var-x">x</span> - 2.000) = 26.000<br>
                              • Hitung: 3<span class="var-x">x</span> + 2<span class="var-x">x</span> - 4.000 = 26.000 ➔ 5<span class="var-x">x</span> = 30.000 ➔ <strong><span class="var-x">x</span> = Rp6.000</strong>`
            },
            {
                id: 5,
                story: "Jumlah dua buah bilangan positif (<span class='var-x'>x</span> dan <span class='var-y'>y</span>) adalah <strong>45</strong>. Bilangan pertama (<span class='var-x'>x</span>) nilainya <strong>4 kali lipat</strong> dari bilangan kedua (<span class='var-x'>x</span> = 4<span class='var-y'>y</span>). Berapakah nilai bilangan kedua?",
                options: [
                    { label: "A", text: "9" },
                    { label: "B", text: "36" },
                    { label: "C", text: "12" },
                    { label: "D", text: "15" }
                ],
                correctIndex: 0, // A
                explanation: `• Model: <span class="var-x">x</span> + <span class="var-y">y</span> = 45 dan <span class="var-x">x</span> = 4<span class="var-y">y</span><br>
                              • Substitusi <span class="var-x">x</span>: 4<span class="var-y">y</span> + <span class="var-y">y</span> = 45<br>
                              • Hitung: 5<span class="var-y">y</span> = 45 ➔ <strong><span class="var-y">y</span> = 9</strong>`
            },
            {
                id: 6,
                story: "Sebuah lapangan berbentuk persegi panjang memiliki setengah keliling <strong>30 meter</strong> (<span class='var-x'>x</span> + <span class='var-y'>y</span> = 30). Panjang lapangan (<span class='var-x'>x</span>) adalah <strong>6 meter lebih panjang</strong> dari lebarnya (<span class='var-x'>x</span> = <span class='var-y'>y</span> + 6). Berapakah lebar lapangan (<span class='var-y'>y</span>)?",
                options: [
                    { label: "A", text: "18 meter" },
                    { label: "B", text: "12 meter" },
                    { label: "C", text: "10 meter" },
                    { label: "D", text: "15 meter" }
                ],
                correctIndex: 1, // B
                explanation: `• Model: <span class="var-x">x</span> + <span class="var-y">y</span> = 30 dan <span class="var-x">x</span> = <span class="var-y">y</span> + 6<br>
                              • Substitusi <span class="var-x">x</span>: (<span class="var-y">y</span> + 6) + <span class="var-y">y</span> = 30<br>
                              • Hitung: 2<span class="var-y">y</span> + 6 = 30 ➔ 2<span class="var-y">y</span> = 24 ➔ <strong><span class="var-y">y</span> = 12 meter</strong>`
            },
            {
                id: 7,
                story: "Di sebuah peternakan terdapat ayam (<span class='var-x'>x</span>) dan kambing (<span class='var-y'>y</span>) sebanyak <strong>20 ekor</strong> (<span class='var-x'>x</span> = 20 - <span class='var-y'>y</span>). Jumlah total kaki seluruh hewan adalah <strong>56 kaki</strong> (2<span class='var-x'>x</span> + 4<span class='var-y'>y</span> = 56). Berapakah jumlah kambing (<span class='var-y'>y</span>)?",
                options: [
                    { label: "A", text: "12 ekor" },
                    { label: "B", text: "10 ekor" },
                    { label: "C", text: "8 ekor" },
                    { label: "D", text: "6 ekor" }
                ],
                correctIndex: 2, // C
                explanation: `• Model: <span class="var-x">x</span> = 20 - <span class="var-y">y</span> dan 2<span class="var-x">x</span> + 4<span class="var-y">y</span> = 56<br>
                              • Substitusi <span class="var-x">x</span>: 2(20 - <span class="var-y">y</span>) + 4<span class="var-y">y</span> = 56<br>
                              • Hitung: 40 - 2<span class="var-y">y</span> + 4<span class="var-y">y</span> = 56 ➔ 2<span class="var-y">y</span> = 16 ➔ <strong><span class="var-y">y</span> = 8 ekor</strong>`
            },
            {
                id: 8,
                story: "Di parkiran terdapat mobil (<span class='var-x'>x</span>) dan sepeda motor (<span class='var-y'>y</span>) sebanyak <strong>30 unit</strong> (<span class='var-y'>y</span> = 30 - <span class='var-x'>x</span>). Tarif parkir mobil Rp5.000 dan motor Rp2.000, dengan total pendapatan <strong>Rp90.000</strong> (5<span class='var-x'>x</span> + 2<span class='var-y'>y</span> = 90). Berapakah banyak mobil (<span class='var-x'>x</span>)?",
                options: [
                    { label: "A", text: "10 unit" },
                    { label: "B", text: "20 unit" },
                    { label: "C", text: "15 unit" },
                    { label: "D", text: "12 unit" }
                ],
                correctIndex: 0, // A
                explanation: `• Model: <span class="var-y">y</span> = 30 - <span class="var-x">x</span> dan 5<span class="var-x">x</span> + 2<span class="var-y">y</span> = 90<br>
                              • Substitusi <span class="var-y">y</span>: 5<span class="var-x">x</span> + 2(30 - <span class="var-x">x</span>) = 90<br>
                              • Hitung: 5<span class="var-x">x</span> + 60 - 2<span class="var-x">x</span> = 90 ➔ 3<span class="var-x">x</span> = 30 ➔ <strong><span class="var-x">x</span> = 10 unit</strong>`
            },
            {
                id: 9,
                story: "Ibu membeli 2 kg apel (<span class='var-x'>x</span>) dan 3 kg jeruk (<span class='var-y'>y</span>) seharga <strong>Rp85.000</strong>. Jika harga 1 kg apel adalah <strong>Rp5.000 lebih mahal</strong> dari 1 kg jeruk (<span class='var-x'>x</span> = <span class='var-y'>y</span> + 5.000), berapakah harga 1 kg jeruk?",
                options: [
                    { label: "A", text: "Rp20.000" },
                    { label: "B", text: "Rp12.000" },
                    { label: "C", text: "Rp18.000" },
                    { label: "D", text: "Rp15.000" }
                ],
                correctIndex: 3, // D
                explanation: `• Model: 2<span class="var-x">x</span> + 3<span class="var-y">y</span> = 85.000 dan <span class="var-x">x</span> = <span class="var-y">y</span> + 5.000<br>
                              • Substitusi <span class="var-x">x</span>: 2(<span class="var-y">y</span> + 5.000) + 3<span class="var-y">y</span> = 85.000<br>
                              • Hitung: 2<span class="var-y">y</span> + 10.000 + 3<span class="var-y">y</span> = 85.000 ➔ 5<span class="var-y">y</span> = 75.000 ➔ <strong><span class="var-y">y</span> = Rp15.000</strong>`
            },
            {
                id: 10,
                story: "Jumlah tabungan Andi (<span class='var-x'>x</span>) dan Budi (<span class='var-y'>y</span>) adalah <strong>Rp250.000</strong> (<span class='var-x'>x</span> + <span class='var-y'>y</span> = 250.000). Tabungan Andi adalah <strong>Rp50.000 lebih banyak</strong> dari tabungan Budi (<span class='var-x'>x</span> = <span class='var-y'>y</span> + 50.000). Berapakah tabungan Budi?",
                options: [
                    { label: "A", text: "Rp100.000" },
                    { label: "B", text: "Rp150.000" },
                    { label: "C", text: "Rp125.000" },
                    { label: "D", text: "Rp80.000" }
                ],
                correctIndex: 0, // A
                explanation: `• Model: <span class="var-x">x</span> + <span class="var-y">y</span> = 250.000 dan <span class="var-x">x</span> = <span class="var-y">y</span> + 50.000<br>
                              • Substitusi <span class="var-x">x</span>: (<span class="var-y">y</span> + 50.000) + <span class="var-y">y</span> = 250.000<br>
                              • Hitung: 2<span class="var-y">y</span> + 50.000 = 250.000 ➔ 2<span class="var-y">y</span> = 200.000 ➔ <strong><span class="var-y">y</span> = Rp100.000</strong>`
            }
        ];

        // State Management
        let currentQuestionIndex = 0;
        let userAnswers = {}; // Format: { questionIndex: { selectedOption: number, isCorrect: boolean } }

        const STORAGE_KEY = 'spldv_quiz_user_answers';

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadState();
            renderNavGrid();
            renderQuestion(currentQuestionIndex);
        });

        // Load State from LocalStorage
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    userAnswers = JSON.parse(saved);
                } catch (e) {
                    userAnswers = {};
                }
            }
            updateAnsweredCount();
        }

        // Save State to LocalStorage
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userAnswers));
            updateAnsweredCount();
        }

        function updateAnsweredCount() {
            const count = Object.keys(userAnswers).length;
            document.getElementById('answered-count').textContent = count;
        }

        // Render Question Grid Buttons
        function renderNavGrid() {
            const grid = document.getElementById('nav-grid');
            grid.innerHTML = '';

            quizData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.onclick = () => jumpToQuestion(idx);
                btn.id = `nav-btn-${idx}`;
                
                let bgClass = "bg-slate-100 text-slate-700 hover:bg-slate-200";
                
                if (userAnswers[idx] !== undefined) {
                    if (userAnswers[idx].isCorrect) {
                        bgClass = "bg-emerald-500 text-white font-bold";
                    } else {
                        bgClass = "bg-rose-500 text-white font-bold";
                    }
                }

                if (idx === currentQuestionIndex) {
                    bgClass += " ring-2 ring-indigo-600 ring-offset-1 font-extrabold";
                }

                btn.className = `py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${bgClass}`;
                btn.innerText = idx + 1;
                grid.appendChild(btn);
            });
        }

        // Jump to Question
        function jumpToQuestion(idx) {
            currentQuestionIndex = idx;
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('question-card').classList.remove('hidden');
            renderQuestion(currentQuestionIndex);
            renderNavGrid();
        }

        // Render Active Question
        function renderQuestion(idx) {
            const data = quizData[idx];
            
            // Number & Status Tag
            document.getElementById('question-number-tag').innerText = `Soal ${idx + 1} dari ${quizData.length}`;
            
            const statusTag = document.getElementById('status-tag');
            if (userAnswers[idx] !== undefined) {
                if (userAnswers[idx].isCorrect) {
                    statusTag.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700";
                    statusTag.innerText = "✓ Benar";
                } else {
                    statusTag.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-rose-100 text-rose-700";
                    statusTag.innerText = "✕ Salah";
                }
            } else {
                statusTag.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500";
                statusTag.innerText = "Belum Dijawab";
            }

            // Question Story Text
            document.getElementById('question-text-box').innerHTML = data.story;

            // Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const answered = userAnswers[idx] !== undefined;
            const selectedOpt = answered ? userAnswers[idx].selectedOption : null;

            data.options.forEach((opt, optIdx) => {
                const optBtn = document.createElement('button');
                optBtn.className = getOptionStyle(idx, optIdx);
                optBtn.disabled = answered;
                optBtn.onclick = () => selectAnswer(idx, optIdx);

                optBtn.innerHTML = `
                    <div class="flex items-center gap-3 w-full">
                        <span class="w-7 h-7 rounded-lg border flex items-center justify-center font-bold text-xs shrink-0 ${getBadgeStyle(idx, optIdx)}">
                            ${opt.label}
                        </span>
                        <span class="text-sm font-semibold text-slate-800 text-left">${opt.text}</span>
                    </div>
                `;
                container.appendChild(optBtn);
            });

            // Explanation Box
            const expBox = document.getElementById('explanation-box');
            if (answered) {
                document.getElementById('explanation-content').innerHTML = data.explanation;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            // Navigation Buttons
            document.getElementById('btn-prev').disabled = (idx === 0);
            document.getElementById('btn-prev').classList.toggle('opacity-50', idx === 0);
            
            const nextBtn = document.getElementById('btn-next');
            if (idx === quizData.length - 1) {
                nextBtn.innerHTML = `Lihat Hasil <i data-lucide="award" class="w-4 h-4"></i>`;
            } else {
                nextBtn.innerHTML = `Selanjutnya <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
            }

            lucide.createIcons();
        }

        // Get Option Button Style depending on user selection and correctness
        function getOptionStyle(qIdx, optIdx) {
            const base = "w-full p-3.5 rounded-xl border text-left transition flex items-center justify-between ";
            if (userAnswers[qIdx] === undefined) {
                return base + "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/30";
            }

            const isSelected = userAnswers[qIdx].selectedOption === optIdx;
            const isCorrectOption = quizData[qIdx].correctIndex === optIdx;

            if (isCorrectOption) {
                return base + "border-emerald-500 bg-emerald-50/80 ring-2 ring-emerald-400";
            }
            if (isSelected && !isCorrectOption) {
                return base + "border-rose-400 bg-rose-50/80 ring-2 ring-rose-300";
            }
            return base + "border-slate-200 bg-slate-50/50 opacity-60";
        }

        // Get Badge Style for A, B, C, D
        function getBadgeStyle(qIdx, optIdx) {
            if (userAnswers[qIdx] === undefined) {
                return "border-slate-300 bg-slate-100 text-slate-700";
            }
            const isSelected = userAnswers[qIdx].selectedOption === optIdx;
            const isCorrectOption = quizData[qIdx].correctIndex === optIdx;

            if (isCorrectOption) {
                return "border-emerald-600 bg-emerald-600 text-white";
            }
            if (isSelected && !isCorrectOption) {
                return "border-rose-500 bg-rose-500 text-white";
            }
            return "border-slate-300 bg-slate-100 text-slate-500";
        }

        // Handle Answer Selection
        function selectAnswer(qIdx, optIdx) {
            if (userAnswers[qIdx] !== undefined) return;

            const isCorrect = (optIdx === quizData[qIdx].correctIndex);
            userAnswers[qIdx] = {
                selectedOption: optIdx,
                isCorrect: isCorrect
            };

            saveState();
            renderQuestion(qIdx);
            renderNavGrid();

            // Trigger minor confetti on correct answer
            if (isCorrect) {
                confetti({ particleCount: 35, spread: 50, origin: { y: 0.7 } });
            }

            // Check if all answered, trigger prompt
            if (Object.keys(userAnswers).length === quizData.length) {
                setTimeout(() => {
                    showResultScreen();
                }, 1500);
            }
        }

        // Navigate Prev/Next
        function navigateQuestion(direction) {
            const newIdx = currentQuestionIndex + direction;

            if (newIdx >= quizData.length) {
                showResultScreen();
                return;
            }

            if (newIdx >= 0 && newIdx < quizData.length) {
                jumpToQuestion(newIdx);
            }
        }

        // Display Final Result Screen
        function showResultScreen() {
            document.getElementById('question-card').classList.add('hidden');
            const resCard = document.getElementById('result-card');
            resCard.classList.remove('hidden');

            let correctCount = 0;
            Object.values(userAnswers).forEach(ans => {
                if (ans.isCorrect) correctCount++;
            });

            const wrongCount = Object.keys(userAnswers).length - correctCount;
            const score = Math.round((correctCount / quizData.length) * 100);

            document.getElementById('stat-correct').innerText = correctCount;
            document.getElementById('stat-wrong').innerText = wrongCount;
            document.getElementById('stat-score').innerText = score;

            const msgBox = document.getElementById('stat-message');
            if (score === 100) {
                msgBox.innerText = "🌟 Luar Biasa! Kamu menguasai semua soal cerita SPLDV Metode Substitusi!";
                confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
            } else if (score >= 70) {
                msgBox.innerText = "👍 Hebat! Kamu sudah memahami konsep substitusi dengan sangat baik.";
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            } else {
                msgBox.innerText = "💪 Tetap semangat! Yuk pelajari kembali pembahasan soal dan coba lagi.";
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Review Answers
        function reviewAnswers() {
            jumpToQuestion(0);
        }

        // Confirm and Reset Quiz
        function confirmReset() {
            if (confirm("Apakah kamu yakin ingin mengulang quiz dari awal? Semua jawaban akan direset.")) {
                localStorage.removeItem(STORAGE_KEY);
                userAnswers = {};
                currentQuestionIndex = 0;
                updateAnsweredCount();
                renderNavGrid();
                document.getElementById('result-card').classList.add('hidden');
                document.getElementById('question-card').classList.remove('hidden');
                renderQuestion(0);
            }
        }
    </script>
</body>
</html>
